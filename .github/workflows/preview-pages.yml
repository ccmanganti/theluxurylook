name: Publish safe visual-only preview to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_static_preview.py'
      - 'database/data/portfolio-seed.json'
      - 'public/assets/**'
      - '.github/workflows/preview-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: 'pages'
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SEO-safe static design preview
        run: python3 scripts/build_static_preview.py
      # Mirror the review-only HTML into main's root because this Pages site
      # is also configured to serve / (branch) using Jekyll.
      # No production app files in public/ or Laravel internals are modified.
      - name: Publish preview pages to root for branch-based GitHub Pages
        run: |
          cp -a preview-dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .nojekyll index.html robots.txt assets portfolio portfolios services about blog contact
          if ! git diff --cached --quiet; then
            git commit -m "build(preview): add site pages for temporary Pages preview [skip ci]"
            git push origin HEAD:main
          fi
