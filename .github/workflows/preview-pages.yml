name: Publish safe visual-only preview to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_static_preview.py'
      - 'database/data/portfolio-seed.json'
      - 'public/assets/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: 'pages'
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SEO-safe static design preview
        run: python3 scripts/build_static_preview.py
      # GitHub's GITHUB_TOKEN cannot enable Pages for the first time.
      # Repository owner must select Settings > Pages > Source: GitHub Actions once.
      - name: Read GitHub Pages configuration
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview-dist
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
