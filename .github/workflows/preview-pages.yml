name: Publish safe visual-only preview to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_static_preview.py'
      - 'database/data/portfolio-seed.json'
      - 'public/assets/**'
      - '.github/workflows/preview-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: 'pages'
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SEO-safe static design preview
        run: python3 scripts/build_static_preview.py
      # Mirror the review-only HTML into main's root because this Pages site
      # is also configured to serve / (branch) using Jekyll.
      # No production app files in public/ or Laravel internals are modified.
      - name: Publish preview pages to root for branch-based GitHub Pages
        run: |
          cp -a preview-dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .nojekyll index.html robots.txt assets portfolio portfolios services about blog contact
          if ! git diff --cached --quiet; then
            git commit -m "build(preview): add site pages for temporary Pages preview [skip ci]"
            git push origin HEAD:main
          fi
      # GitHub's GITHUB_TOKEN cannot enable Pages for the first time.
      # Repository owner must select Settings > Pages > Source: GitHub Actions once.
      - name: Read GitHub Pages configuration
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview-dist
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
